<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">QC-Reframe — 把灵感，变成你的下一张图。</title>
  <desc id="desc">在 Codex 内置浏览器选图，通过本机 Codex CLI 逆向提示词，再用 Codex 直接生成图片。</desc>
  <rect width="1280" height="480" rx="24" fill="#141111"/>
  <g transform="translate(56 38) scale(.75)">
  <rect x="6" y="6" width="56" height="56" rx="14" fill="#141111"/>
  <rect x="2" y="2" width="56" height="56" rx="14" fill="#ffd440" stroke="#141111" stroke-width="3"/>
  <path d="M16 46V14h17c9 0 15 4 15 12 0 5-3 9-8 11l10 9H36L26 36v10Z" fill="#141111"/>
  <path d="M26 22h6c4 0 6 1 6 4s-2 4-6 4h-6Z" fill="#27ccf3"/>
  <path d="m29 36 11 10h10L39 36Z" fill="#fe7da8"/>
</g>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="118" y="72" fill="#fffaf0" font-size="25" font-weight="650" letter-spacing="-.6">QC-Reframe</text>
    <text x="59" y="134" fill="#aaa59d" font-size="13" letter-spacing="3">YOUR CODEX. YOUR CREATIVE WORKSPACE.</text>
    <text x="54" y="236" fill="#fffaf0" font-size="94" font-weight="700" letter-spacing="-5">See it.</text>
    <text x="54" y="330" fill="#ffd440" font-size="94" font-weight="700" letter-spacing="-5">Reframe it.</text>
    <text x="59" y="399" fill="#eee8de" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="500">把灵感，变成你的下一张图。</text>
    <path d="M765 123V373" stroke="#524b45" stroke-width="1.5"/>
    <g font-family="'PingFang SC', 'Microsoft YaHei', sans-serif">
      <rect x="728" y="103" width="494" height="86" rx="14" fill="#252220" stroke="#403a35"/>
      <text x="752" y="155" fill="#aaa59d" font-size="18">01</text>
      <text x="807" y="156" fill="#fffaf0" font-size="28" font-weight="600">浏览器选图</text>
      <text x="1189" y="153" text-anchor="end" fill="#aaa59d" font-family="Inter, sans-serif" font-size="13" letter-spacing="1">BROWSER</text>
      <rect x="728" y="207" width="494" height="86" rx="14" fill="#ffd440"/>
      <text x="752" y="259" fill="#625019" font-size="18">02</text>
      <text x="807" y="260" fill="#141111" font-size="28" font-weight="600">CLI 细查逆向</text>
      <text x="1189" y="257" text-anchor="end" fill="#625019" font-family="Inter, sans-serif" font-size="13" letter-spacing="1">PROMPT</text>
      <rect x="728" y="311" width="494" height="86" rx="14" fill="#ccbafa"/>
      <text x="752" y="363" fill="#61507f" font-size="18">03</text>
      <text x="807" y="364" fill="#141111" font-size="28" font-weight="600">Codex 直接生图</text>
      <text x="1189" y="361" text-anchor="end" fill="#61507f" font-family="Inter, sans-serif" font-size="13" letter-spacing="1">IMAGE</text>
    </g>
  </g>
</svg>
